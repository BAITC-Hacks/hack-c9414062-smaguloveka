[project]
name = "ai-hatshy"
version = "0.1.0"
description = "AI Hatshy — локальный ИИ-секретарь: протокол совещания, диаризация, поручения, напоминания"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "onnx-asr[cpu,hub]>=0.7",
  "sherpa-onnx>=1.12",
  "python-docx>=1.1",
  "fpdf2>=2.8",
  "httpx>=0.27",
  "mcp>=1.2",
]
